<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="que2.css">
</head>

<body class="bg-light text-dark">

    <header class="text-center mt-4 mb-3">
        <h1 class="fw-bold">Pravali</h1>
        <p class="lead">Cyber Security Enthusiast & Frontend Developer</p>
    </header>

    <main>
        <section class="container text-center p-5">

            <!-- Profile Image -->
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
                 class="img-fluid rounded-circle profile-img"
                 alt="Profile image">

            <h2 class="mt-4 fw-bold">Hello, I'm Pravali</h2>

            <p>
                I am a student interested in cybersecurity, networking
                and frontend development.
            </p>

            <!-- Buttons -->
            <div class="mt-4">
                <button class="btn btn-primary me-2">
                    Hire Me
                </button>

                <button class="btn btn-outline-primary">
                    Download CV
                </button>
            </div>

            <!-- Contact Form -->
            <div class="contact-box mt-5">

                <h3 class="mb-3">Contact Me</h3>

                <form>
                    <input type="text"
                           class="form-control mb-3"
                           placeholder="Your Name">

                    <input type="email"
                           class="form-control mb-3"
                           placeholder="Your Email">

                    <textarea class="form-control mb-3"
                              rows="4"
                              placeholder="Your Message"></textarea>

                    <button class="btn btn-success">
                        Send Message
                    </button>
                </form>

            </div>

        </section>
    </main>

    <footer class="text-center p-3 bg-dark text-white">
        © 2026 Pravali Portfolio
    </footer>

</body>
</html>
