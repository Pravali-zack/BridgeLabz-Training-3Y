<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="que3.css">
</head>

<body>

    <header class="text-center p-4 bg-dark text-white">
        <h1>Tech Store</h1>
        <p>Quality products at affordable prices</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <!-- Bootstrap row -->
        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b"
                         class="card-img-top"
                         alt="Headphones">

                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p class="fw-bold">₹1,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </article>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                         class="card-img-top"
                         alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5>Smart Watch</h5>
                        <p class="fw-bold">₹2,499</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </article>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad"
                         class="card-img-top"
                         alt="Mobile Phone">

                    <div class="card-body text-center">
                        <h5>Smartphone</h5>
                        <p class="fw-bold">₹19,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </article>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <article class="card product-card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef"
                         class="card-img-top"
                         alt="Laptop">

                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p class="fw-bold">₹49,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>

                </article>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        © 2026 Tech Store
    </footer>

</body>
</html>
