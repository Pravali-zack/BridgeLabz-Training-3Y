<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="que5.css">
</head>

<body>

    <header class="blog-header text-white text-center p-5">
        <h1>Tech Insights</h1>
        <p>Learn. Explore. Grow.</p>
    </header>

    <main class="container py-5">

        <div class="row g-4">

            <!-- Blog 1 -->
            <div class="col-md-6">

                <article class="card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc31"
                         class="card-img-top"
                         alt="Cybersecurity">

                    <div class="card-body">
                        <h2 class="card-title">Introduction to Cybersecurity</h2>

                        <p class="card-text">
                            Learn the basic concepts of cybersecurity and
                            how to protect digital information.
                        </p>

                        <button class="btn btn-primary">Read More</button>
                    </div>

                </article>

            </div>

            <!-- Blog 2 -->
            <div class="col-md-6">

                <article class="card shadow-sm h-100">

                    <img src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                         class="card-img-top"
                         alt="Technology">

                    <div class="card-body">
                        <h2 class="card-title">Future of Technology</h2>

                        <p class="card-text">
                            Explore how modern technologies are changing
                            our everyday lives.
                        </p>

                        <button class="btn btn-primary">Read More</button>
                    </div>

                </article>

            </div>

        </div>

    </main>

    <footer class="text-center p-4">
        © 2026 Tech Insights
    </footer>

</body>
</html>
