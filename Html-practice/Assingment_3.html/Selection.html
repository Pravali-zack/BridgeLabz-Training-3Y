<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection</title>
</head>

<body>

    <h1>Travel Destination Selection</h1>

    <form>

        <!-- Country -->
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
        </select>

        <br><br>

        <!-- State -->
        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="uttar-pradesh" selected>Uttar Pradesh</option>
            <option value="delhi">Delhi</option>
            <option value="maharashtra">Maharashtra</option>
            <option value="rajasthan">Rajasthan</option>
        </select>

        <br><br>

        <!-- City -->
        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mathura" selected>Mathura</option>
            <option value="agra">Agra</option>
            <option value="lucknow">Lucknow</option>
            <option value="varanasi">Varanasi</option>
        </select>

        <br><br>

        <!-- Favorite Tourist Place -->
        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="taj-mahal" selected>Taj Mahal</option>
            <option value="goa">Goa</option>
            <option value="manali">Manali</option>
            <option value="jaipur">Jaipur</option>
        </select>

    </form>

    <br>

    <!-- Summary -->
    <p>
        <strong>My Travel Choice:</strong>
        I have selected India as my country,
        Uttar Pradesh as my state,
        Mathura as my city,
        and the Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
