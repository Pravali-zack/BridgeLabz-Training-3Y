<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="que4.css">
</head>

<body>

    <header>
        <h1 id="main-heading">CSS Selectors Practice</h1>
    </header>

    <main>

        <section class="box">
            <p>Element Selector</p>

            <p class="special">Class Selector</p>

            <p id="unique">ID Selector</p>

            <input type="text" placeholder="Attribute Selector">

            <div>
                <p>Descendant Selector</p>
            </div>

            <ul>
                <li>First Item</li>
                <li>Second Item</li>
            </ul>

            <h3>Heading</h3>
            <p>Adjacent Sibling</p>
            <p>General Sibling</p>
        </section>

    </main>

    <footer>
        <p>CSS Selectors</p>
    </footer>

</body>
</html>
