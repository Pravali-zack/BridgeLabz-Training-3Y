<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <link rel="stylesheet" href="que5.css">
</head>

<body>

    <h1>Pricing Plans</h1>

    <div class="pricing">

        <!-- Basic Plan -->
        <div class="plan">
            <h2>Basic</h2>

            <div class="price">₹299 / month</div>

            <ul>
                <li>5 Projects</li>
                <li>Email Support</li>
                <li>Basic Analytics</li>
            </ul>

            <a href="#" class="btn">Choose Plan</a>
        </div>


        <!-- Standard Plan -->
        <div class="plan popular">
            <h2>Standard</h2>

            <div class="price">₹599 / month</div>

            <ul>
                <li>15 Projects</li>
                <li>Priority Support</li>
                <li>Advanced Analytics</li>
            </ul>

            <a href="#" class="btn">Choose Plan</a>
        </div>


        <!-- Premium Plan -->
        <div class="plan">
            <h2>Premium</h2>

            <div class="price">₹999 / month</div>

            <ul>
                <li>Unlimited Projects</li>
                <li>24/7 Support</li>
                <li>Advanced Analytics</li>
            </ul>

            <a href="#" class="btn">Choose Plan</a>
        </div>

    </div>

</body>

</html>
