<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>External Website</title>
</head>

<body>

    <h1>External Website</h1>

    <!-- Embed an external website using iframe -->
    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia Website"
        width="80%"
        height="500">
    </iframe>

    <!-- Note about website embedding -->
    <p>
        Some websites may not allow embedding for security reasons.
    </p>

</body>

</html>
