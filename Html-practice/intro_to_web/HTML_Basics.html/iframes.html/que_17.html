<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>

<body>

    <h1>Simple Form</h1>

    <!-- Form submits the result to the iframe named "resultFrame" -->
    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- This iframe displays result.html after clicking Submit -->
    <iframe
        name="resultFrame"
        title="Form Result"
        width="80%"
        height="150">
    </iframe>

</body>

</html>
