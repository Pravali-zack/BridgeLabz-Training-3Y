<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quotations Example</title>
</head>

<body>

    <h1>Quotations</h1>

    <!-- Long quotation using blockquote -->
    <blockquote>
        The future belongs to those who believe in the beauty of their dreams.
        Always work hard and keep learning new things.
    </blockquote>

    <!-- Short quotation using q -->
    <p>
        My teacher often says, <q>Practice &amp; patience lead to success.</q>
    </p>

</body>

</html>
