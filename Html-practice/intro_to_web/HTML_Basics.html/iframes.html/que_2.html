<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Map</title>
</head>

<body>

    <!-- Heading -->
    <h1>My City - Mathura</h1>

    <!-- Google Map embedded using iframe -->
    <!-- loading="lazy" loads the map only when it is near the visible area -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar%20Pradesh&output=embed"
        title="Google Map showing Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
