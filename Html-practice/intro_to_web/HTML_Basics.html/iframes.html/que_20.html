<!DOCTYPE html>
<html lang="en">

<head>

    <!--
        <title> sets the title of the webpage
        displayed in the browser tab.
    -->
    <title>Important Head Elements</title>

    <!--
        <meta charset> defines the character encoding
        used by the webpage.
    -->
    <meta charset="UTF-8">

    <!--
        <meta name="description"> provides a short
        description of the webpage for search engines.
    -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!--
        <meta name="author"> specifies the author
        of the webpage.
    -->
    <meta name="author" content="Pravali">

    <!--
        <base> sets the base URL for relative URLs
        used throughout the webpage.
    -->
    <base href="https://example.com/">

    <!--
        <link> connects the HTML document to an
        external resource such as a favicon.
    -->
    <link rel="icon" href="favicon.ico">

    <!--
        <style> is used to write CSS styles.
        It is empty here as required.
    -->
    <style>
    </style>

    <!--
        <script> is used to add JavaScript.
        It is empty here as required.
    -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>This page demonstrates important elements used inside the HTML head section.</p>

</body>

</html>
