<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Specifies UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Pravali">

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title of the webpage -->
    <title>UTF-8 Encoding Example</title>

</head>

<body>

    <!-- Paragraph containing English, Hindi, and Japanese text -->
    <p>
        Hello! This is an English sentence.
        नमस्ते! यह एक हिंदी वाक्य है।
        こんにちは！これは日本語の文章です。
    </p>

</body>

</html>
